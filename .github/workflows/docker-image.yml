name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Optional: Bei GitHub Container Registry (GHCR) oder Docker Hub anmelden
      # - name: Bei Docker Registry anmelden
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata generieren (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: my-image-name
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Docker Image bauen (und optional pushen)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Auf 'true' setzen, wenn du in eine Registry pushen willst
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
